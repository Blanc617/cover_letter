<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Outer ring -->
  <circle cx="32" cy="32" r="29.5" stroke="#B8862A" stroke-width="0.9"/>

  <!-- Diamond ornaments at cardinal points -->
  <!-- Top -->
  <path d="M32 0 L34.2 2.5 L32 5 L29.8 2.5 Z" fill="#B8862A"/>
  <!-- Bottom -->
  <path d="M32 59 L34.2 61.5 L32 64 L29.8 61.5 Z" fill="#B8862A"/>
  <!-- Left -->
  <path d="M0 32 L2.5 29.8 L5 32 L2.5 34.2 Z" fill="#B8862A"/>
  <!-- Right -->
  <path d="M59 32 L61.5 29.8 L64 32 L61.5 34.2 Z" fill="#B8862A"/>

  <!-- Inner ring (subtle) -->
  <circle cx="32" cy="32" r="24.5" stroke="#B8862A" stroke-width="0.45" opacity="0.45"/>

  <!-- Serif C -->
  <!-- Arc: center ~(30.5, 32), radius 11, tips at top-right and bottom-right -->
  <!-- Opens to the right. Large-arc CCW sweep. -->
  <path d="M 38.3 24.2 A 11 11 0 1 0 38.3 39.8"
        stroke="#B8862A" stroke-width="2.6" fill="none" stroke-linecap="butt"/>

  <!-- Top serif bar -->
  <line x1="34.8" y1="24.2" x2="41.8" y2="24.2" stroke="#B8862A" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Bottom serif bar -->
  <line x1="34.8" y1="39.8" x2="41.8" y2="39.8" stroke="#B8862A" stroke-width="1.3" stroke-linecap="round"/>

</svg>
